name: LoM Disable MineColonies Worldgen (Forge 1.20.1)
on:
  push:
    branches: [dev]
    paths:
      - 'addons/lom-no-minecolonies-worldgen/**'
      - '.github/workflows/lom-no-minecolonies-worldgen.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: addons/lom-no-minecolonies-worldgen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Build Forge mod
        run: gradle --no-daemon build --stacktrace
      - name: Verify embedded structure overrides
        run: |
          jar tf build/libs/lom-no-minecolonies-worldgen-0.1.1.jar | grep 'data/minecolonies/worldgen/structure_set/empty_colony.json'
          jar tf build/libs/lom-no-minecolonies-worldgen-0.1.1.jar | grep 'data/minecolonies/worldgen/structure_set/empty_nether_colony.json'
      - name: Verify all known MineColonies 1.1.1301 worldgen sets
        run: |
          for set in empty_colony barbarian_camp amazon_camp desert_camp ship; do
            jar tf build/libs/lom-no-minecolonies-worldgen-0.1.1.jar | grep "data/minecolonies/worldgen/structure_set/${set}.json"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: lom-no-minecolonies-worldgen-forge
          path: addons/lom-no-minecolonies-worldgen/build/libs/*.jar
          if-no-files-found: error
